<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>FTTR — Mobile App</title>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0A0A0F"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0A0F;--card:#12121A;--cb:#1E1E2E;--ac:#A8E806;--blue:#2BB6F0;
  --red:#FF4757;--pu:#A855F7;--tx:#F0F0F0;--mu:#6B6B80;--ml:#9999AA;
  --inp:#0A0A0F;--pink:#FF6B9D;
}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--ac);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes tick{from{opacity:.7}to{opacity:1}}
input,select,button{font-family:inherit}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 30px var(--card) inset!important;-webkit-text-fill-color:var(--tx)!important}
select option{background:var(--card);color:var(--tx)}

/* LAYOUT */
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.page{flex:1;padding:13px 14px 90px;overflow-y:auto;animation:fadeUp .35s ease}
.hidden{display:none!important}

/* TOPBAR */
#topbar{padding:11px 14px 9px;border-bottom:1px solid var(--cb);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(10,10,15,.92);backdrop-filter:blur(12px);z-index:100}
.brand{font-family:Impact,Arial Black,sans-serif;font-size:15px;letter-spacing:1px}
.brand .ft{color:var(--blue)}.brand .tr{color:var(--ac)}
.greeting{padding:6px 14px 2px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mu)}
.greeting strong{color:var(--tx)}
.greeting .tags{display:flex;gap:6px}
.tag-sport{font-size:9px;padding:1px 7px;border-radius:10px;background:var(--blue)22;color:var(--blue)}
.tag-goal{font-size:9px;padding:1px 7px;border-radius:10px;background:var(--ac)22;color:var(--ac)}
.top-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--cb);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.top-btn:hover{border-color:var(--ac);color:var(--ac)}
.top-btns{display:flex;gap:6px}

/* NAV */
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(18,18,26,.96);backdrop-filter:blur(16px);border-top:1px solid var(--cb);display:flex;padding:7px 0 13px;z-index:200}
.nav-btn{flex:1;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0}
.nav-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:all .2s;border:1.5px solid transparent}
.nav-btn.active .nav-icon{background:rgba(168,232,6,.2);border-color:rgba(168,232,6,.35)}
.nav-btn.active svg{stroke:var(--ac)}
.nav-btn svg{stroke:var(--mu);transition:.2s}
.nav-label{font-size:8px;color:var(--mu);letter-spacing:.5px}
.nav-btn.active .nav-label{color:var(--ac)}

/* CARDS & INPUTS */
.card{background:var(--card);border:1px solid var(--cb);border-radius:14px;padding:14px}
.inp{width:100%;background:var(--inp);border:1px solid var(--cb);border-radius:8px;color:var(--tx);padding:10px 12px;font-size:13px;outline:none}
.inp:focus{border-color:var(--ac)}
.sel{width:100%;background:var(--inp);border:1px solid var(--cb);border-radius:8px;color:var(--tx);padding:10px 12px;font-size:13px;outline:none;appearance:none;cursor:pointer}
.label{font-size:11px;color:var(--mu);margin-bottom:4px}
.btn-primary{width:100%;padding:12px;border-radius:10px;border:none;background:var(--ac);color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn-primary:hover{background:#b8f007}
.btn-primary:disabled{background:var(--cb);color:var(--mu);cursor:not-allowed}
.btn-secondary{flex:1;padding:11px;border-radius:10px;border:1px solid var(--cb);background:transparent;color:var(--mu);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn-secondary:hover{border-color:var(--ac);color:var(--ac)}

/* LOGIN PAGE */
#login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px 40px;animation:fadeIn .4s ease;position:relative}
.login-brand{font-family:Impact,Arial Black,sans-serif;font-size:42px;letter-spacing:1px;line-height:1.1;text-align:center;margin-bottom:6px}
.login-tagline{font-size:10px;color:var(--mu);letter-spacing:2px;margin-bottom:28px;text-align:center}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--cb);border-radius:20px;padding:22px}
.login-title{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--ac);margin-bottom:4px}
.login-sub{color:var(--mu);font-size:13px;margin-bottom:20px}
.input-wrap{position:relative;margin-bottom:10px}
.input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.input-wrap .inp{padding-left:40px}
.input-wrap.has-toggle .inp{padding-right:40px}
.toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--mu)}
.err-box{background:rgba(255,71,87,.15);border:1px solid rgba(255,71,87,.4);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--red);margin-bottom:10px}

/* PROFILE WIZARD */
#wizard-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:fadeIn .4s ease}
.wizard-brand{font-family:Impact,Arial Black,sans-serif;font-size:30px;margin-bottom:16px;text-align:center}
.step-dots{display:flex;gap:7px;margin-bottom:14px}
.step-dot{height:4px;border-radius:2px;background:var(--cb);transition:all .3s;width:10px}
.step-dot.active{width:26px;background:var(--ac)}
.wizard-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--cb);border-radius:20px;padding:20px}
.step-label{font-size:10px;color:var(--mu);letter-spacing:1px;margin-bottom:12px}
.step-title{font-size:22px;font-weight:800;color:var(--ac);letter-spacing:2px;margin-bottom:4px}
.step-sub{font-size:12px;color:var(--mu);margin-bottom:14px}
.radio-option{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--cb);background:transparent;cursor:pointer;transition:all .2s;margin-bottom:7px}
.radio-option:hover{border-color:var(--ac)44}
.radio-option.selected{border-color:var(--ac);background:rgba(168,232,6,.1)}
.radio-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--cb);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.radio-option.selected .radio-dot{border-color:var(--ac)}
.radio-fill{width:9px;height:9px;border-radius:50%;background:var(--ac);display:none}
.radio-option.selected .radio-fill{display:block}
.radio-label{font-size:14px;color:var(--ml)}
.radio-option.selected .radio-label{color:var(--tx);font-weight:600}
.check-option{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--cb);background:transparent;cursor:pointer;transition:all .2s;margin-bottom:6px}
.check-option:hover{border-color:var(--ac)44}
.check-option.selected{border-color:var(--ac);background:rgba(168,232,6,.1)}
.checkbox{width:18px;height:18px;border-radius:5px;border:2px solid var(--cb);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.check-option.selected .checkbox{background:var(--ac);border-color:var(--ac)}
.check-option .check-label{font-size:13px;color:var(--ml)}
.check-option.selected .check-label{color:var(--tx)}

/* LIVE AGE WIDGET */
.live-age{background:var(--bg);border:1px solid var(--cb);border-radius:12px;padding:12px 14px;margin-top:10px}
.live-age-header{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:12px}
.live-age-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.live-stat{background:var(--card);border-radius:9px;padding:9px 11px;border:1px solid var(--cb)}
.live-stat-num{font-size:20px;font-weight:800;line-height:1}
.live-stat-lbl{font-size:9px;color:var(--mu);margin-top:2px;letter-spacing:.5px}
.live-secs{margin-top:7px;background:var(--card);border-radius:9px;padding:9px 11px;border:1px solid rgba(255,71,87,.3);display:flex;align-items:center;justify-content:space-between}
.secs-num{font-size:22px;font-weight:800;color:var(--red);animation:tick .5s infinite alternate}

/* WORKOUT PAGE */
.section-title{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--ac);margin-bottom:4px}
.section-sub{color:var(--mu);font-size:12px;margin-bottom:14px}
.search-wrap{position:relative;margin-bottom:9px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.search-inp{width:100%;padding:9px 13px 9px 34px;background:var(--card);border:1px solid var(--cb);border-radius:9px;color:var(--tx);font-size:13px;outline:none}
.search-inp:focus{border-color:var(--ac)44}
.filter-bar{display:flex;gap:5px;margin-bottom:7px;overflow-x:auto;padding-bottom:2px}
.filter-bar::-webkit-scrollbar{display:none}
.fchip{padding:4px 10px;border-radius:20px;border:1.5px solid var(--cb);background:transparent;color:var(--mu);font-size:10px;cursor:pointer;white-space:nowrap;transition:.2s}
.fchip.active{background:rgba(168,232,6,.15);border-color:var(--ac);color:var(--ac)}
.fchip.blue.active{background:rgba(43,182,240,.15);border-color:var(--blue);color:var(--blue)}
.fchip.red.active{background:rgba(255,71,87,.15);border-color:var(--red);color:var(--red)}
.progress-row{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.prog-bar-wrap{flex:1;background:var(--cb);border-radius:4px;height:4px;overflow:hidden}
.prog-bar{height:100%;background:var(--ac);border-radius:4px;transition:width .4s}
.prog-label{color:var(--ml);font-size:10px;white-space:nowrap}
.add-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;border:none;background:var(--ac);color:var(--bg);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;letter-spacing:1px}
.eq-filter{display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:8px 12px;cursor:pointer;transition:.2s}
.eq-filter.on{border-color:var(--ac)}
.eq-filter-chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--cb);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.eq-filter.on .eq-filter-chk{background:var(--ac);border-color:var(--ac)}
.eq-filter-text{font-size:12px;color:var(--mu);flex:1}
.eq-filter.on .eq-filter-text{color:var(--ac)}
.eq-filter-count{font-size:10px;color:var(--ml)}
.ex-card{background:var(--card);border:1px solid var(--cb);border-radius:11px;padding:11px 12px;margin-bottom:7px;transition:.2s}
.ex-card.done{background:rgba(168,232,6,.05);border-color:rgba(168,232,6,.3)}
.ex-row{display:flex;align-items:center;gap:8px}
.ex-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--cb);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s}
.ex-card.done .ex-check{background:var(--ac);border-color:var(--ac)}
.ex-info{flex:1;cursor:pointer;min-width:0}
.ex-name{font-weight:600;font-size:13px;color:var(--tx);transition:.2s}
.ex-card.done .ex-name{color:var(--mu);text-decoration:line-through}
.ex-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
.badge{font-size:8px;padding:1px 5px;border-radius:8px;white-space:nowrap}
.badge.custom{background:rgba(168,85,247,.2);color:var(--pu)}
.badge.beg{background:rgba(78,205,196,.2);color:#4ECDC4}
.badge.int{background:rgba(168,232,6,.2);color:var(--ac)}
.badge.adv{background:rgba(255,71,87,.2);color:var(--red)}
.ex-meta{font-size:10px;color:var(--mu);margin-top:1px}
.muscle-tag{padding:2px 7px;border-radius:20px;font-size:9px;font-weight:600;flex-shrink:0}
.icon-btn{width:25px;height:25px;border-radius:7px;border:1px solid var(--cb);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn.danger{border-color:rgba(255,71,87,.25);background:rgba(255,71,87,.1)}
.timer-bar{background:rgba(255,71,87,.15);border:1px solid var(--red);border-radius:11px;padding:10px 14px;margin-bottom:11px;display:flex;align-items:center;gap:10px}
.timer-num{font-size:22px;font-weight:800;color:var(--red)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-box{width:100%;max-width:430px;background:var(--card);border-radius:20px 20px 0 0;padding:20px;padding-bottom:32px;animation:slideUp .3s ease;max-height:88vh;overflow-y:auto}
.modal-title{font-size:20px;font-weight:800;letter-spacing:2px;color:var(--ac);margin-bottom:16px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.close-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--cb);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* NUTRITION */
.nut-ring{display:flex;align-items:center;gap:15px;margin-bottom:13px}
.macro-bar-wrap{flex:1}
.macro-row{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-bottom:3px}
.macro-bg{background:var(--cb);border-radius:3px;height:5px;overflow:hidden;margin-bottom:8px}
.macro-fill{height:100%;border-radius:3px;transition:width .4s}
.food-card{background:var(--card);border:1px solid var(--cb);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:10px;margin-bottom:7px}
.food-img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--cb)}
.food-name{font-size:13px;font-weight:600;color:var(--tx)}
.food-macro{font-size:10px;color:var(--mu);margin-top:1px}
.food-cal{font-size:11px;color:var(--ac);margin-right:7px;font-weight:700}
.log-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--cb);align-items:center;gap:7px}
.log-item:last-child{border-bottom:none}

/* PROGRESS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--cb);border-radius:11px;padding:10px 8px;text-align:center}
.stat-val{font-size:17px;font-weight:800;line-height:1}
.stat-lbl{font-size:10px;color:var(--mu);margin-top:2px}
.metric-tabs{display:flex;gap:5px;margin-bottom:9px;overflow-x:auto}
.metric-tab{flex:1;padding:6px 7px;border-radius:8px;border:1.5px solid var(--cb);background:transparent;color:var(--mu);font-size:10px;cursor:pointer;white-space:nowrap;min-width:55px;transition:.2s}
.metric-tab.active{border-color:var(--ac);background:rgba(168,232,6,.15);color:var(--ac)}
canvas.chart{width:100%!important;height:140px!important}
.ach-card{background:var(--card);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.ach-icon-box{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ach-label{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach-date{font-size:10px;color:var(--mu);margin-top:1px}
.ach-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* SLEEP */
.sleep-time-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sleep-time-lbl{font-size:10px;color:var(--mu);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.sleep-time-inp{width:100%;background:var(--inp);border:1px solid var(--cb);border-radius:8px;color:var(--tx);padding:8px 9px;font-size:16px;font-weight:700;outline:none}
.sleep-time-inp:focus{border-color:var(--blue)}
.quality-pill{padding:4px 12px;border-radius:20px;font-weight:700;font-size:12px}
.goal-btns{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.goal-hr-btn{padding:3px 10px;border-radius:20px;border:1.5px solid var(--cb);background:transparent;color:var(--mu);font-size:11px;cursor:pointer;transition:.2s}
.goal-hr-btn.active{border-color:var(--blue);background:rgba(43,182,240,.15);color:var(--blue)}
.save-btn{margin-left:auto;padding:4px 11px;border-radius:7px;background:var(--blue);color:var(--bg);font-weight:700;font-size:11px;border:none;cursor:pointer}
.tip-card{background:var(--card);border:1px solid var(--cb);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tip-num{width:21px;height:21px;border-radius:6px;background:rgba(43,182,240,.2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--blue);flex-shrink:0}

/* FAVORITES */
.day-tabs{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{padding:6px 10px;border-radius:9px;border:1.5px solid var(--cb);background:transparent;color:var(--mu);font-size:10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:.2s}
.day-tab.active{border-color:var(--ac);background:rgba(168,232,6,.12);color:var(--ac)}
.day-cnt{border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;font-size:9px}
.day-tab.active .day-cnt{background:var(--ac);color:var(--bg)}
.day-cnt{background:var(--cb);color:var(--mu)}
.fav-card{background:var(--card);border-radius:12px;padding:12px 13px;display:flex;gap:11px;align-items:center;margin-bottom:8px}
.fav-time{font-size:11px;font-weight:700;color:var(--ac);flex-shrink:0;min-width:36px}
.fav-ex{font-weight:700;font-size:13px;color:var(--tx)}
.fav-muscle{font-size:9px;padding:1px 6px;border-radius:9px;}
.set-boxes{display:flex;gap:5px;align-items:center}
.set-box{width:18px;height:18px;border-radius:5px;background:rgba(168,232,6,.15);border:1px solid rgba(168,232,6,.3);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ac)}
.reps-lbl{font-size:11px;color:var(--blue);font-weight:700}
.week-overview{background:var(--card);border:1px solid var(--cb);border-radius:12px;padding:12px 13px;margin-top:14px}
.week-grid{display:flex;gap:4px}
.week-col{flex:1;text-align:center}
.week-bar{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:3px}
.week-lbl{font-size:8px;color:var(--mu)}
.empty-state{text-align:center;padding:32px 0}
.empty-icon{width:48px;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--cb);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}

/* SVG ICONS */
svg{stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app">
  <!-- Pages injected here by JS -->
</div>

<script>
// ── COLORS ──────────────────────────────────────────────────────────────────
const DK={bg:"#0A0A0F",card:"#12121A",cb:"#1E1E2E",ac:"#A8E806",blue:"#2BB6F0",red:"#FF4757",pu:"#A855F7",tx:"#F0F0F0",mu:"#6B6B80",ml:"#9999AA",inp:"#0A0A0F",pink:"#FF6B9D"};
const LT={bg:"#F4F4EF",card:"#FFFFFF",cb:"#E2E2DA",ac:"#5A9100",blue:"#0B7FB8",red:"#DC2626",pu:"#7C3AED",tx:"#111111",mu:"#6B7280",ml:"#9CA3AF",inp:"#F9F9F6",pink:"#E11D7A"};

// ── STATE ────────────────────────────────────────────────────────────────────
let STATE={
  dark:true, auth:null, tab:"wo",

function h(tag,cls,content,style="",extra=""){
  return `<${tag}${cls?` class="${cls}"`:""}${style?` style="${style}"`:""}${extra}>${content}</${tag}>`;
}
function setTheme(){
  C=STATE.dark?DK:LT;
  document.body.style.background=C.bg;
  document.body.style.color=C.tx;
}
function re(){setTheme();render();}

// ── TIMER ─────────────────────────────────────────────────────────────────────
let timerInterval=null;
function startTimer(secs){
  clearInterval(timerInterval);
  STATE.restVal=secs;STATE.restTimer=true;
  timerInterval=setInterval(()=>{
    STATE.restVal--;
    if(STATE.restVal<=0){clearInterval(timerInterval);STATE.restTimer=false;}
    const el=document.getElementById("timer-num");
    if(el)el.textContent=STATE.restVal+"s";
    else{clearInterval(timerInterval);STATE.restTimer=false;}
  },1000);
  re();
}
function stopTimer(){clearInterval(timerInterval);STATE.restTimer=false;re();}

// ── LIVE AGE COUNTER ──────────────────────────────────────────────────────────
let ageInterval=null;
function startAgeCounter(){
  if(ageInterval)clearInterval(ageInterval);
  ageInterval=setInterval(updateAgeDisplay,1000);
}
function stopAgeCounter(){if(ageInterval)clearInterval(ageInterval);}
function updateAgeDisplay(){
  if(!STATE.auth?.dob)return;
  const diff=Date.now()-new Date(STATE.auth.dob).getTime();
  const days=Math.floor(diff/864e5);
  const hours=Math.floor(diff/36e5);
  const secs=Math.floor(diff/1000);
  const el_d=document.getElementById("live-days");
  const el_h=document.getElementById("live-hours");
  const el_hb=document.getElementById("live-hb");
  const el_br=document.getElementById("live-br");
  const el_s=document.getElementById("live-secs");
  if(el_d)el_d.textContent=days.toLocaleString();
  if(el_h)el_h.textContent=hours.toLocaleString();
  if(el_hb)el_hb.textContent=Math.floor(secs*1.1667).toLocaleString();
  if(el_br)el_br.textContent=Math.floor(secs/4).toLocaleString();
  if(el_s)el_s.textContent=secs.toLocaleString();
}

function drawChart(){
  const canvas=document.getElementById("progress-chart");
  if(!canvas)return;
  const ctx=canvas.getContext("2d");
  const data=STATE.graphData;
  const metric=STATE.graphMetric;
  const color=metric==="weight"?C.ac:metric==="bench"?C.blue:C.pu;
  canvas.width=canvas.offsetWidth*2;canvas.height=280;
  ctx.scale(2,2);
  const W=canvas.offsetWidth/2,H=140;
  const vals=data.map(d=>d[metric]);
  const mn=Math.min(...vals)-2,mx=Math.max(...vals)+2;
  ctx.clearRect(0,0,W,H);
  const px=(i)=>i*(W-30)/(data.length-1)+15;
  const py=(v)=>H-20-(v-mn)/(mx-mn)*(H-30);
  ctx.strokeStyle=C.cb;ctx.lineWidth=1;ctx.setLineDash([3,3]);
  for(let i=0;i<4;i++){const y=py(mn+(mx-mn)*i/3);ctx.beginPath();ctx.moveTo(15,y);ctx.lineTo(W-15,y);ctx.stroke();}
  ctx.setLineDash([]);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,color+"55");grad.addColorStop(1,color+"00");
  ctx.beginPath();ctx.moveTo(px(0),py(vals[0]));
  for(let i=1;i<data.length;i++)ctx.lineTo(px(i),py(vals[i]));
  ctx.lineTo(px(data.length-1),H-20);ctx.lineTo(px(0),H-20);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.setLineDash([]);
  ctx.moveTo(px(0),py(vals[0]));
  for(let i=1;i<data.length;i++)ctx.lineTo(px(i),py(vals[i]));
  ctx.stroke();
  data.forEach((d,i)=>{ctx.beginPath();ctx.arc(px(i),py(vals[i]),4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();});
  ctx.fillStyle=C.mu;ctx.font="10px monospace";
  data.forEach((d,i)=>{ctx.fillText(d.w,px(i)-8,H-5);});
}
function drawSleepChart(){
  const canvas=document.getElementById("sleep-chart");
  if(!canvas)return;
  const ctx=canvas.getContext("2d");
  canvas.width=canvas.offsetWidth*2;canvas.height=240;
  ctx.scale(2,2);
  const W=canvas.offsetWidth/2,H=120;
  const vals=SLEEP_DATA.map(d=>d.h);
  const mn=4,mx=10;
  ctx.clearRect(0,0,W,H);
  const px=(i)=>i*(W-30)/(SLEEP_DATA.length-1)+15;
  const py=(v)=>H-20-(v-mn)/(mx-mn)*(H-30);
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,C.blue+"55");grad.addColorStop(1,C.blue+"00");
  ctx.beginPath();ctx.moveTo(px(0),py(vals[0]));
  for(let i=1;i<SLEEP_DATA.length;i++)ctx.lineTo(px(i),py(vals[i]));
  ctx.lineTo(px(SLEEP_DATA.length-1),H-20);ctx.lineTo(px(0),H-20);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.strokeStyle=C.blue;ctx.lineWidth=2.5;
  ctx.moveTo(px(0),py(vals[0]));
  for(let i=1;i<SLEEP_DATA.length;i++)ctx.lineTo(px(i),py(vals[i]));
  ctx.stroke();
  SLEEP_DATA.forEach((d,i)=>{ctx.beginPath();ctx.arc(px(i),py(d.h),3,0,Math.PI*2);ctx.fillStyle=C.blue;ctx.fill();});
  ctx.fillStyle=C.mu;ctx.font="10px monospace";
  SLEEP_DATA.forEach((d,i)=>{ctx.fillText(d.d,px(i)-8,H-5);});
}

// ── SLEEP CALC ────────────────────────────────────────────────────────────────
function calcSleep(){
  const[bh,bm]=STATE.sleepBed.split(":").map(Number);
  const[wh,wm]=STATE.sleepWake.split(":").map(Number);
  let d=(wh*60+wm)-(bh*60+bm);if(d<0)d+=1440;
  return+(d/60).toFixed(1);
}

  fav.sets=window._selectedSets||fav.sets;
  fav.note=document.getElementById("m-fav-note")?.value||"";
  closeModal();renderPage();
}

function bindPage(){}

// ── INIT ───────────────────────────────────────────────────────────────────────
setTheme();
render();
</script>
