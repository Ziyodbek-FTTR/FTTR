<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTTR</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0d0d0d;
        }

        header {
            padding: 20px;
            text-align: center;
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 5px;
            color: #35b6ff;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #28a745;
            text-decoration: none;
            border-radius: 8px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0);
            text-align: center;
        }

        .signup-box {
            width: 400px;
            margin: 30px auto;
            padding: 30px;
            background: #111;
            border-radius: 20px;
        }

        .signup-box input {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
        }

        .signup-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;

            background: #b6ff00;
            color: black;

            border: none;
            border-radius: 12px;

            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;
            padding-right: 70px;
            box-sizing: border-box;
        }

        .password-box span {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            cursor: pointer;
        }

        .toggle-btn {
            display: block;
            text-align: center;
            margin: 10px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .profile-box {
            width: 600px;
            margin: 40px auto;
            padding: 40px;
            background: #10131c;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .profile-box h2 {
            width: 100%;
            text-align: center;
            color: #c6ff00;
            margin-bottom: 25px;
        }

        .profile-box select,
        .profile-box input {
            width: 220px;
            padding: 15px;
            background: #0a0a0f;
            border: 1px solid #222;
            color: white;
        }

        .profile-box button {
            margin-top: 20px;
            padding: 15px 40px;
            background: #c6ff00;
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-box button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .profile-box button:not(:disabled) {
            opacity: 1;
            cursor: pointer;
        }

        .step-text {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .progress span {
            width: 30px;
            height: 6px;
            background: #222;
            border-radius: 10px;
        }

        .progress.active {
            background: #c6ff00;
        }

        .progress span.active {
            background: #c6ff00;
        }

        .stats-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin: 20px 0;
        }

        .stat-card {
            background: #0a0a0f;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            color: #c6ff00;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: white;
            font-size: 14px;
        }

        .sizes-group {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;

        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: #9ca3af;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            background: #0d0f17;
            border: 1px solid #232733;
            color: white;
            padding: 14px;
            border-radius: 12px;
        }

        .wrist-group {
            margin-left: auto;
            margin-right: auto;
            grid-column: 1 / 3;
            justify-self: center;
            width: 220px;
        }

        .sizes-group>button {
            grid-column: 1 / 3;
            justify-self: center;
            margin-left: auto;
            margin-right: auto;
        }

        .step2-content {
            width: 100%;
            text-align: left;
        }

        .step2-content h2 {
            color: #c6ff00;
            text-align: center;
            margin-bottom: 8px;
        }

        .step2-content p {
            color: #9ca3af;
            text-align: center;
            margin-bottom: 20px;
        }

        .sport-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sport-list label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 15px;
            background: #0a0a0f;
            border: 1px solid #222;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }

        .sport-list input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #c6ff00;
        }

        .step2-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .step2-buttons button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .step2-buttons button:first-child {
            background: #222;
            color: white;
        }

        #step3Btn {
            background: #c6ff00;
            color: black;
            opacity: 1;
            transition: 0.2s;
        }

        #step3Btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            color: black;
            background: #c6ff00;
        }

        #step4Btn {
            background: #c6ff00;
            color: black;
            opacity: 1;
            transition: 0.2s;
        }

        #step4Btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .equipment-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .equipment-list label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 15px;
            background: #0a0a0f;
            border: 1px solid #222;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }

        .equipment-list input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #c6ff00;
        }
    </style>

</head>

<body>

    <header>
        <h1>
            <span style="color: #35b6ff;">FT</span><span style="color:#39ff14;">TR</span>
        </h1>
    </header>


    <section class="hero">

        <h1 style="color:#35b6ff;">From Training</h1>

        <h1 style="color:#39ff14;">To Result</h1>

        <div id="profile-page" class="profile-box" style="display: none;">

            <h2>Your Profile</h2>

            <p class="step-text">Step 1 of 4</p>

            <div class="progress">
                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <h3 class="age-result"></h3>
            <select id="genderSelect">
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <input type="date" id="birthDate">

            <div class="stats-box">
                <div class="stat-card">
                    <h3 id="daysAlive">0</h3>
                    <p>Days Alive</p>
                </div>

                <div class="stat-card">
                    <h3 id="hoursAlive">0</h3>
                    <p>Hours Alive</p>
                </div>

                <div class="stat-card">
                    <h3 id="minutesAlive">0</h3>
                    <p>Minutes Alive</p>
                </div>

                <div class="stat-card">
                    <h3 id="secondsAlive">0</h3>
                    <p>Seconds Alive</p>
                </div>
            </div>

            <div class="sizes-group">

                <div class="input-group">
                    <label>Weight(kg)</label>
                    <input type="number" id="weight">
                </div>


                <div class="input-group">
                    <label>Height(cm)</label>
                    <input type="number" id="height">
                </div>

                <div class="input-group">
                    <label>Forearm Size(cm)</label>
                    <input type="number" id="forearm">
                </div>

                <div class="input-group">
                    <label>Biceps Size(cm)</label>
                    <input type="number" id="biceps">
                </div>


                <div class="input-group wrist-group">
                    <label>Wrist Size(cm)</label>
                    <input type="number" id="wrist">
                </div>

                <button onclick="goStep2()">Step 2</button>
            </div>

        </div>

        <div class="signup-box">

            <h2>
                <span style="color:#35b6ff;">Create</span>
                <span style="color:#39ff14;">Account</span>
            </h2>

            <input type="text" id="fullName" placeholder="Full Name">

            <input type="email" id="email" placeholder="Email Adress">

            <input type="password" id="password" placeholder="Password">

            <input type="password" id="confirmPassword" placeholder="Confirm Password">

            <button class="signup-btn" onclick="openProfile()">Sign-Up</button>

        </div>

    </section>

    <script>
        function togglePasswods() {
            let pass1 = document.getElementById("password");
            let pass2 = document.getElementById("confirmPassword");

            if (pass1.type === "password") {
                pass1.type = "text";
                pass2.type = "text";
            } else {
                pass1.type = "password";
                pass2.type = "password";
            }
        }

        function openProfile() {
            let fullName = document.getElementById("fullName").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;

            if (
                fullName === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === ""
            ) {
                alert("Please fill all fields");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            document.querySelector(".signup-box").style.display = "none";
            document.getElementById("profile-page").style.display = "block";

            let ageTimer = null

            document.getElementById("birthDate").addEventListener("change", function () {

                const birthDate = new Date(this.value);

                function updateAge() {

                    const now = new Date();
                    const diff = now - birthDate;

                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor(diff / (1000 * 60));
                    const seconds = Math.floor(diff / 1000);

                    document.getElementById("daysAlive").textContent = days.toLocaleString();
                    document.getElementById("hoursAlive").textContent = hours.toLocaleString();
                    document.getElementById("minutesAlive").textContent = minutes.toLocaleString();
                    document.getElementById("secondsAlive").textContent = seconds.toLocaleString();
                }

                if (ageTimer !== null) {
                    clearInterval(ageTimer)
                }

                updateAge();

                ageTimer = setInterval(updateAge, 1000)
            });

        }

        function goStep2() {
            let birthDate = document.getElementById("birthDate").value;
            let weight = document.getElementById("weight").value;
            let height = document.getElementById("height").value;
            let forearm = document.getElementById("forearm").value;
            let biceps = document.getElementById("biceps").value;
            let wrist = document.getElementById("wrist").value;

            let genderSelect = document.getElementById("genderSelect");
            let gender = genderSelect ? genderSelect.value : ""

            if (
                birthDate === "" ||
                weight === "" ||
                height === "" ||
                forearm === "" ||
                biceps === "" ||
                wrist === ""
            ) {
                alert("Please fill all fields");
                return;
            }

            const userData = {
                birthDate: birthDate,
                weight: weight,
                height: height,
                forearm: forearm,
                biceps: biceps,
                wrist: wrist,
                gender: gender
            };
            localStorage.setItem("step1Data", JSON.stringify(userData));

            document.getElementById("profile-page").innerHTML = `
                <div class="step2-content">

<p class="step-text">Step 2 of 4</p>
        
            <div class="progress">
                <span class="active"></span>
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>


                    <h2>SPORT MAJOR</h2>

                    <p>What is your main sport?</p>

                    <div class="sport-list">

                        <label>
                            <input type="radio" name="sport" value="Arm Wrestling">
                                Arm Wrestling
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Running">
                                Running
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Football">
                                Football
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Basketball">
                                Basketball
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Boxing">
                                Boxing
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Kickboxing">
                                Kickboxing
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Karate">
                                Karate
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Wrestling">
                                Wrestling
                        </label>

                        <label>
                            <input type="radio" name="sport" value="No Sport Major">
                                No Sport Major
                        </label>

                    </div>

                    <div class="step2-buttons">
                         <button onclick="goBackToStep1()">← 1</button>
                        <button onclick="goStep3()" id="step3Btn" disabled>Step 3 →</button>
                    </div>

                </div>
                `;

            const savedSport = localStorage.getItem("selectedSport");
            if (savedSport) {
                document.querySelectorAll('input[name="sport"]').forEach(function (radio) {
                    if (radio.value === savedSport) {
                        radio.checked = true;
                        document.getElementById("step3Btn").disabled = false;
                    }
                });
            }

            document.querySelectorAll('input[name="sport"]').forEach(function (radio) {
                radio.addEventListener("change", function () {
                    document.getElementById("step3Btn").disabled = false;
                });
            });
        }

        function goBackToStep1() {
            document.querySelector(".signup-box").style.display = "none";
            document.getElementById("profile-page").style.display = "block";

            document.getElementById("profile-page").innerHTML = `
                <h2>Your Profile</h2>

            <p class="step-text">Step 1 of 4</p>

            <div class="progress">
                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <h3 class="age-result"></h3>
            <select id="genderSelect">
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <input type="date" id="birthDate">

            <div class="stats-box">
                <div class="stat-card">
                    <h3 id="daysAlive">0</h3>
                    <p>Days Alive</p>
                </div>

                <div class="stat-card">
                    <h3 id="hoursAlive">0</h3>
                    <p>Hours Alive</p>
                </div>

                <div class="stat-card">
                    <h3 id="minutesAlive">0</h3>
                    <p>Minutes Alive</p>
                </div>

                <div class="stat-card">
                    <h3 id="secondsAlive">0</h3>
                    <p>Seconds Alive</p>
                </div>
            </div>

            <div class="sizes-group">

                <div class="input-group">
                    <label>Weight(kg)</label>
                    <input type="number" id="weight">
                </div>


                <div class="input-group">
                    <label>Height(cm)</label>
                    <input type="number" id="height">
                </div>

                <div class="input-group">
                    <label>Forearm Size(cm)</label>
                    <input type="number" id="forearm">
                </div>

                <div class="input-group">
                    <label>Biceps Size(cm)</label>
                    <input type="number" id="biceps">
                </div>


                <div class="input-group wrist-group">
                    <label>Wrist Size(cm)</label>
                    <input type="number" id="wrist">
                </div>

                <button onclick="goStep2()">Step 2</button>
            </div>
            `;

            const savedData = localStorage.getItem("step1Data");
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById("birthDate").value = data.birthDate || "";
                document.getElementById("weight").value = data.weight || "";
                document.getElementById("height").value = data.height || "";
                document.getElementById("forearm").value = data.forearm || "";
                document.getElementById("biceps").value = data.biceps || "";
                document.getElementById("wrist").value = data.wrist || "";

                if (data.gender) {
                    document.getElementById("genderSelect").value = data.gender;
                }

                if (data.birthDate) {
                    updateAgeStats(data.birthDate);
                }
            }

            document.getElementById("birthDate").addEventListener("change", function () {
                updateAgeStats(this.value);
            });
        }
        function goBackToStep2() {
            document.getElementById("profile-page").innerHTML = `
             <div class="step2-content">

<p class="step-text">Step 2 of 4</p>
        
            <div class="progress">
                <span class="active"></span>
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>

                    <h2>SPORT MAJOR</h2>

                    <p>What is your main sport?</p>

                    <div class="sport-list">

                        <label><input type="radio" name="sport" value="Arm Wrestling">
                             Arm Wrestling
                             </label>

                        <label>
                            <input type="radio" name="sport" value="Running">
                                Running
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Football">
                                Football
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Basketball">
                                Basketball
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Boxing">
                                Boxing
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Kickboxing">
                                Kickboxing
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Karate">
                                Karate
                        </label>

                        <label>
                            <input type="radio" name="sport" value="Wrestling">
                                Wrestling
                        </label>

                        <label>
                            <input type="radio" name="sport" value="No Sport Major">
                                No Sport Major
                        </label>

                    </div>

                    <div class="step2-buttons">
                         <button onclick="goBackToStep1()">← 1</button>
                        <button onclick="goStep3()" id="step3Btn" disabled>Step 3 →</button>
                    </div>

                </div>
                `;


            const savedSport = localStorage.getItem("selectedSport");
            if (savedSport) {
                document.querySelectorAll('input[name="sport"]').forEach(function (radio) {
                    if (radio.value === savedSport) {
                        radio.checked = true;
                        document.getElementById("step3Btn").disabled = false;
                    }
                });
            }

            document.querySelectorAll('input[name="sport"]').forEach(function (radio) {
                radio.addEventListener("change", function () {
                    document.getElementById("step3Btn").disabled = false;
                });
            });
        }

        function goStep3() {
            const selectedSport = document.querySelector('input[name="sport"]:checked');
            if (!selectedSport) {
                alert("Please select a sport");
                return;
            }
            localStorage.setItem("selectedSport", selectedSport.value);

            document.getElementById("profile-page").innerHTML = `
        <div class="step2-content">

<p class="step-text">Step 3 of 4</p>
        
            <div class="progress">
                <span class="active"></span>
                <span class="active"></span>
                <span class="active"></span>
                <span></span>
            </div>

            <h2>EQUIPMENT</h2>

            <p>Select all that you have</p>

            <div class="equipment-list">

                <label>
                    <input type="checkbox" name="equipment" value="Barbell">
                    Barbell
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="Dumbbells">
                    Dumbbells
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="Pull-up Bar">
                    Pull-up Bar
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="Resistance Band">
                    Resistance Band
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="Kettlebell">
                    Kettlebell
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="Abs Roller">
                    Abs Roller
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="Hand Gripper">
                    Hand Gripper
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="All Gym Equipments">
                    All Gym Equipments
                </label>

                <label>
                    <input type="checkbox" name="equipment" value="No Equipment">
                    No Equipment
                </label>

            </div>

            <div class="step2-buttons">
                <button onclick="goBackToStep2()">← 2</button>
                <button onclick="goStep4()" id="step4Btn" disabled>Step 4 →</button>
            </div>

        </div>
    `;

            document.querySelectorAll('input[name="equipment"]').forEach(function (checkbox) {
                checkbox.addEventListener("change", function () {
                    document.getElementById("step4Btn").disabled = false;
                });
            });

        }

        function updateAgeStats(birthDateValue) {
            if (!birthDateValue) return;

            const birthDate = new Date(birthDateValue);

            function updateAge() {
                const now = new Date();
                const diff = now - birthDate;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor(diff / (1000 * 60));
                const seconds = Math.floor(diff / 1000);

                document.getElementById("daysAlive").textContent = days.toLocaleString();
                document.getElementById("hoursAlive").textContent = hours.toLocaleString();
                document.getElementById("minutesAlive").textContent = minutes.toLocaleString();
                document.getElementById("secondsAlive").textContent = seconds.toLocaleString();
            }

            updateAge();
            if (window.ageTimer) clearInterval(window.ageTimer);
            window.ageTimer = setInterval(updateAge, 1000);
        }

        function goStep4() {

            const selectedEquipment =
                document.querySelectorAll('input[name="equipment"]:checked');

            if (selectedEquipment.length === 0) {
                alert("Please select at least one equipment");
                return;
            }

            document.getElementById("profile-page").innerHTML = `
                <div class="step2-content">

                    <p class="step-text">Step 4 of 4</p> 
            <div class="progress">
                <span class="active"></span>
                <span class="active"></span>
                <span class="active"></span>
                <span class="active"></span>
            </div>
                    
                    <h2>TRAINING GOAL</h2>

                    <p>Choose your primary goal</p>

                    <div class="sport-list">

                        <label>
                            <input type="radio" name="goal" value="Lose Weight">
                                Lose Weight
                        </label>

                        <label>
                            <input type="radio" name="goal" value="Build Muscle">
                                Build Muscle
                        </label>

                        <label>
                            <input type="radio" name="goal" value="Increase Strength">
                                Increase Strength
                        </label>

                        <label>
                            <input type="radio" name="goal" value="Stay Healthy">
                                Stay Healthy
                        </label>

                    </div>

                    <div class="step2-buttons">
                        <button onclick="goBackToStep3()">← 3</button>
                        <button onclick="createAccount()" id="createAccountBtn" disabled>
                            Create Account
                        </button>
                    </div>

                </div>
               ` ;

            document.querySelectorAll('input[name="goal"]').forEach(function (radio) {
                radio.addEventListener("change", function () {
                    document.getElementById("createAccountBtn").disabled = false;
                });
            });
        }


        function goBackToStep3() {
            document.getElementById("profile-page").innerHTML = `
                <div class="step2-content">

<p class="step-text">Step 3 of 4</p>
        
            <div class="progress">
                <span class="active"></span>
                <span class="active"></span>
                <span class="active"></span>
                <span></span>
            </div>


                    <h2>EQUIPMENT</h2>
                    <p>Select all that you have</p>
                    <div class="equipment-list">

                        <label><input type="checkbox" name="equipment" value="Barbell">Barbell</label>
                        <label> <input type="checkbox" name="equipment" value="Dumbbells"> Dumbbells</label>
                        <label><input type="checkbox" name="equipment" value="Pull-up Bar"> Pull-up Bar</label>
                        <label><input type="checkbox" name="equipment" value="Resistance Band"> Resistance Band</label>
                        <label><input type="checkbox" name="equipment" value="Kettlebell"> Kettlebell</label>
                        <label><input type="checkbox" name="equipment" value="Abs Roller"> Abs Roller</label>
                        <label><input type="checkbox" name="equipment" value="Hand Gripper"> Hand Gripper</label>
                        <label><input type="checkbox" name="equipment" value="All Gym Equipments">  All Gym Equipments </label>
                        <label><input type="checkbox" name="equipment" value="No Equipment">  No Equipment</label>

                    </div>

                    <div class="step2-buttons">
                        <button onclick="goBackToStep2()">← 2</button>
                        <button onclick="goStep4()" id="step4Btn" disabled>Step 4 →</button>
                    </div>
                </div>
               ` ;

            const savedEquipment = JSON.parse(localStorage.getItem("selectedEquipment") || "[]");
            if (savedEquipment.length > 0) {
                document.querySelectorAll('input[name="equipment"]').forEach(function (checkbox) {
                    if (savedEquipment.includes(checkbox.value)) {
                        checkbox.checked = true;
                        document.getElementById("step4Btn").disabled = false;
                    }
                });
            }

            document.querySelectorAll('input[name="equipment"]').forEach(function (checkbox) {
                checkbox.addEventListener("change", function () {
                    const checked = document.querySelectorAll('input[name="equipment"]:checked');
                    const values = [];
                    checked.forEach(function (item) {
                        values.push(item.value);
                    });
                    localStorage.setItem("selectedEquipment", JSON.stringify(values));

                    if (checked.length > 0) {
                        document.getElementById("step4Btn").disabled = false;
                    } else {
                        document.getElementById("step4Btn").disabled = true;
                    }
                });
            });
        }
        const exercises = [
            { id: 1, name: "Push-up", sets: "3", reps: "12", rest: "60s", level: "beginner", muscle: "chest", equipment: ["none"] },
            { id: 2, name: "Bench Press", sets: "4", reps: "8", rest: "90s", level: "intermediate", muscle: "chest", equipment: ["barbell"] },
            { id: 3, name: "Pull-up", sets: "3", reps: "8", rest: "90s", level: "intermediate", muscle: "back", equipment: ["pull-up bar"] },
            { id: 4, name: "Dumbbell Row", sets: "3", reps: "12", rest: "60s", level: "beginner", muscle: "back", equipment: ["dumbbells"] },
            { id: 5, name: "Shoulder Press", sets: "3", reps: "10", rest: "60s", level: "beginner", muscle: "shoulders", equipment: ["dumbbells"] },
            { id: 6, name: "Lateral Raises", sets: "3", reps: "15", rest: "45s", level: "beginner", muscle: "shoulders", equipment: ["dumbbells"] },
            { id: 7, name: "Bicep Curls", sets: "3", reps: "12", rest: "60s", level: "beginner", muscle: "biceps", equipment: ["dumbbells", "barbell"] },
            { id: 8, name: "Tricep Dips", sets: "3", reps: "15", rest: "45s", level: "beginner", muscle: "triceps", equipment: ["none"] },
            { id: 9, name: "Squats", sets: "4", reps: "10", rest: "90s", level: "intermediate", muscle: "legs", equipment: ["barbell"] },
            { id: 10, name: "Deadlifts", sets: "4", reps: "6", rest: "120s", level: "advanced", muscle: "back", equipment: ["barbell"] },
            { id: 11, name: "Kettlebell Swing", sets: "3", reps: "15", rest: "60s", level: "intermediate", muscle: "legs", equipment: ["kettlebell"] },
            { id: 12, name: "Pull-up (Band)", sets: "3", reps: "10", rest: "60s", level: "beginner", muscle: "back", equipment: ["resistance band"] },
            { id: 13, name: "Chest Fly", sets: "3", reps: "12", rest: "60s", level: "beginner", muscle: "chest", equipment: ["dumbbells"] },
            { id: 14, name: "Overhead Press", sets: "3", reps: "10", rest: "60s", level: "intermediate", muscle: "shoulders", equipment: ["barbell"] },
            { id: 15, name: "Hamstring Curls", sets: "3", reps: "15", rest: "60s", level: "beginner", muscle: "legs", equipment: ["resistance band"] }
        ];

        let currentLevel = 'all';
        let currentMuscle = 'all';
        let currentTab = 'workout'

        function renderExercises() {
            const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
            const equipmentFilter = document.getElementById('equipmentFilter')?.checked || false;
            const userEquipment = JSON.parse(localStorage.getItem('selectedEquipment') || '[]');

            let filtered = exercises.filter(ex => {

                if (search && !ex.name.toLowerCase().includes(search)) return false;

                if (currentLevel !== 'all' && ex.level !== currentLevel) return false;

                if (currentMuscle !== 'all' && ex.muscle !== currentMuscle) return false;

                if (equipmentFilter) {
                    if (ex.equipment.length === 0) return false;
                    const hasEquipment = ex.equipment.some(eq => {
                        if (eq === 'none') return true;
                        return userEquipment.some(ueq => ueq.toLowerCase().includes(eq));
                    });
                    if (!hasEquipment) return false;
                }

                return true;
            });

            const container = document.getElementById('exerciseList');
            if (!container) return;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: #6b7280;">
                        <p style="font-size: 40px; margin-bottom: 10px;"><i class="fas fa-dumbbell" style="color: #333;"></i></p>
                        <p>No exercises found</p>
                        <p style="font-size: 12px;">Try changing your filters</p>
                    </div>
                   `;
                document.getElementById('exerciseCount').textContent = '0 exercises';
                return;
            }

            container.innerHTML = filtered.map(ex => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: #0a0a0f; border: 1px solid #232733; border-radius: 12px; padding: 12px 16px;">
                    <div style="flex: 1;">
                        <h4 style="color: white; font-size: 15px; margin-bottom: 2px;">${ex.name}</h4>
                        <p style="color: #9ca3af; font-size: 12px;">${ex.sets} sets × ${ex.reps} - ${ex.rest} rest</p>
                        <div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;">
                            <span style="background: #1a1a1a; color: #9ca3af; padding: 2px 10px; border-radius: 10px; font-size: 10px; text-transform: capitalize;">${ex.level}</span>
                            <span style="background: #1a1a1a; color: #35b6ff; padding: 2px 10px; border-radius: 10px; font-size: 10px; text-transform: capitalize;">${ex.muscle}</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button onclick="viewExercise(${ex.id})" style="background: #1a1a1a; border: none; color: #6b7280; padding: 6px 10px; border-radius: 6px; cursor: pointer;">
                            <i class="fas fa-chart-bar"></i>
                        </button>
                        <button onclick="addToWorkout(${ex.id})" style="background: #c6ff00; border: none; color: black; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            document.getElementById('exerciseCount').textContent = `${filtered.length} exercises`;
        }

        function goToDashboard() {
            const fullName = document.getElementById("fullName").value || "User";
            const sport = localStorage.getItem("selectedSport") || "No Sport";
            const goal = localStorage.getItem("selectedGoal") || "No Goal";

            document.getElementById("profile-page").innerHTML = `
        <div class="dashboard" style="width: 100%; text-align: left;">

            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h2 style="color: #35b6ff; font-size: 24px; margin-bottom: 4px;">Hey, ${fullName}</h2>
                    <p style="color: #9ca3af; font-size: 14px;">${sport} · ${goal}</p>
                    <p style="color: #6b7280; font-size: 12px;">${new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</p>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button onclick="showNotification()" style="background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer;">
                        <i class="fas fa-bell"></i>
                    </button>
                    <button onclick="location.reload()" style="background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer;">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>

            <!-- WORKOUT PLAN -->
            <div style="margin-bottom: 20px;">
                <h3 style="color: white; font-size: 20px; display: inline-block;">WORKOUT PLAN</h3>
                <span style="color: #6b7280; font-size: 14px; margin-left: 10px;">Browse & customize</span>
            </div>

            <!-- Search Bar -->
            <div style="position: relative; margin-bottom: 15px;">
                <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6b7280;">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" id="searchInput" placeholder="Search..." oninput="filterExercises()" style="width: 100%; padding: 12px 12px 12px 40px; background: #0a0a0f; border: 1px solid #232733; border-radius: 10px; color: white; font-size: 14px;">
            </div>

            <!-- Level Filters -->
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                <button onclick="setLevel('all')" class="level-filter active" data-level="all" style="padding: 6px 16px; background: #c6ff00; color: black; border: none; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer;">All</button>
                <button onclick="setLevel('beginner')" class="level-filter" data-level="beginner" style="padding: 6px 16px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Beginner</button>
                <button onclick="setLevel('intermediate')" class="level-filter" data-level="intermediate" style="padding: 6px 16px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Intermediate</button>
                <button onclick="setLevel('advanced')" class="level-filter" data-level="advanced" style="padding: 6px 16px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Advanced</button>
            </div>

            <!-- Muscle Group Filters -->
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px;">
                <button onclick="setMuscle('all')" class="muscle-filter active" data-muscle="all" style="padding: 6px 14px; background: #c6ff00; color: black; border: none; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer;">All</button>
                <button onclick="setMuscle('chest')" class="muscle-filter" data-muscle="chest" style="padding: 6px 14px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Chest</button>
                <button onclick="setMuscle('back')" class="muscle-filter" data-muscle="back" style="padding: 6px 14px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Back</button>
                <button onclick="setMuscle('shoulders')" class="muscle-filter" data-muscle="shoulders" style="padding: 6px 14px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Shoulders</button>
                <button onclick="setMuscle('biceps')" class="muscle-filter" data-muscle="biceps" style="padding: 6px 14px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Biceps</button>
                <button onclick="setMuscle('triceps')" class="muscle-filter" data-muscle="triceps" style="padding: 6px 14px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Triceps</button>
                <button onclick="setMuscle('legs')" class="muscle-filter" data-muscle="legs" style="padding: 6px 14px; background: #1a1a1a; color: #9ca3af; border: 1px solid #333; border-radius: 16px; font-size: 12px; cursor: pointer;">Legs</button>
            </div>

            <!-- Stats Bar -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <label style="color: #9ca3af; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" id="equipmentFilter" onchange="filterExercises()" style="accent-color: #c6ff00;"> Show only my equipment
                    </label>
                    <span style="color: #6b7280; font-size: 13px;" id="exerciseCount">${exercises.length} exercises</span>
                </div>
                <button onclick="addWorkout()" style="background: #c6ff00; color: black; border: none; padding: 6px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>

            <!-- Exercise List -->
            <div id="exerciseList" style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;">
            </div>

            <!-- Bottom Navigation -->
            <div style="display: flex; justify-content: space-around; margin-top: 25px; padding-top: 15px; border-top: 1px solid #1a1a1a;">
                <button onclick="showTab('workout')" class="nav-tab active" data-tab="workout" style="background: none; border: none; color: #c6ff00; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <span style="font-size: 20px;"><i class="fas fa-dumbbell"></i></span>
                    Workout
                </button>
                <button onclick="showTab('nutrition')" class="nav-tab" data-tab="nutrition" style="background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
 <span style="font-size: 20px;"><i class="fas fa-utensils"></i></span>
                    Nutrition
                </button>
                <button onclick="showTab('progress')" class="nav-tab" data-tab="progress" style="background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <span style="font-size: 20px;"><i class="fas fa-chart-line"></i></span>
                    Progress
                </button>
                <button onclick="showTab('sleep')" class="nav-tab" data-tab="sleep" style="background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <span style="font-size: 20px;"><i class="fas fa-moon"></i></span>
                    Sleep
                </button>
                <button onclick="showTab('favorites')" class="nav-tab" data-tab="favorites" style="background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                    <span style="font-size: 20px;"><i class="fas fa-star"></i></span>
                    Favorites
                </button>
            </div>

        </div>
    `;

            renderExercises();
        }



        function setLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-filter').forEach(btn => {
                if (btn.dataset.level === level) {
                    btn.style.background = '#c6ff00';
                    btn.style.color = 'black';
                    btn.style.border = 'none';
                } else {
                    btn.style.background = '#1a1a1a';
                    btn.style.color = '#9ca3af';
                    btn.style.border = '1px solid #333';
                }
            });
            renderExercises();
        }

        function setMuscle(muscle) {
            currentMuscle = muscle;
            document.querySelectorAll('.muscle-filter').forEach(btn => {
                if (btn.dataset.muscle === muscle) {
                    btn.style.background = '#c6ff00';
                    btn.style.color = 'black';
                    btn.style.border = 'none';
                } else {
                    btn.style.background = '#1a1a1a';
                    btn.style.color = '#9ca3af';
                    btn.style.border = '1px solid #333';
                }
            });
            renderExercises();
        }

        function filterExercises() {
            renderExercises();
        }

        function viewExercise(id) {
            const ex = exercises.find(e => e.id === id);
            if (!ex) return;
            alert(`📊 ${ex.name}\n${ex.sets} sets × ${ex.reps}\n${ex.rest} rest\nLevel: ${ex.level}\nMuscle: ${ex.muscle}`);
        }

        function addToWorkout(id) {
            const ex = exercises.find(e => e.id === id);
            if (!ex) return;
            alert(`✅ "${ex.name}" added to your workout!`);
        }

        function addWorkout() {
            alert('➕ Create a new workout plan?');
        }

        function showNotification() {
            alert('🔔 No new notifications');
        }

        function showTab(tab) {
            currentTab = tab;

            document.querySelectorAll('.nav-tab').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.style.color = '#c6ff00';
                } else {
                    btn.style.color = '#6b7280';
                }
            });

            const tabs = {
                workout: '💪 Workout section - Your exercises are here!',
                nutrition: '🥗 Nutrition tracking - Coming soon! Track your meals and calories.',
                progress: '📊 Your progress stats - Coming soon! Track your gains.',
                sleep: '😴 Sleep tracking - Coming soon! Improve your recovery.',
                favorites: '⭐ Your favorite exercises - Coming soon!'
            };

            alert(tabs[tab] || 'Coming soon!');
        }

        function createAccount() {
            const selectedGoal = document.querySelector('input[name="goal"]:checked');
            if (!selectedGoal) {
                alert("Please select your goal!");
                return;
            }

            localStorage.setItem("selectedGoal", selectedGoal.value);

            goToDashboard();
        }
    </script>

</body>

</html>
